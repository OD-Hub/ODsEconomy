# ─────────────────────────────────────────────
#   OD Eco v1.1 — Economy Configuration
# ─────────────────────────────────────────────

currency-singular: Dollar
currency-plural: Dollars
currency-symbol: $

starting-balance: 100

# ── Bank Interest ────────────────────────────
interest:
  enabled: true
  rate: 2.5
  interval-minutes: 60

# ── Selling ──────────────────────────────────
sell:
  enabled: true
  multiplier: 1.0

# ── Worth ────────────────────────────────────
worth:
  DIAMOND: 50
  EMERALD: 20
  GOLD_INGOT: 15
  IRON_INGOT: 5
  COPPER_INGOT: 1
  NETHERITE_SCRAP: 200
  NETHERITE_INGOT: 800
  LAPIS_LAZULI: 2
  REDSTONE: 1
  AMETHYST_SHARD: 3
  QUARTZ: 2
  COAL: 1
  RAW_IRON: 3
  RAW_GOLD: 8
  RAW_COPPER: 1
  DIAMOND_BLOCK: 450
  EMERALD_BLOCK: 180
  GOLD_BLOCK: 135
  IRON_BLOCK: 45
  COPPER_BLOCK: 9
  NETHERITE_BLOCK: 7200
  LAPIS_BLOCK: 18
  REDSTONE_BLOCK: 9
  COAL_BLOCK: 9

# ── Lottery ──────────────────────────────────
lottery:
  enabled: true
  ticket-price: 100
  payout-percentage: 80

# ── Dice ─────────────────────────────────────
dice:
  enabled: true
  max-bet: 50000

# ── Banknotes ────────────────────────────────
banknotes:
  enabled: true
  fee-percent: 2

# ── Auctions ─────────────────────────────────
auctions:
  enabled: true
  listing-fee: 0
  tax-percent: 5
  duration-hours: 24

# ── Bounties ────────────────────────────────
bounties:
  enabled: true
  minimum: 100
  tax-percent: 5

# ── Shared Accounts ─────────────────────────
shared-accounts:
  enabled: true

# ── Dealerships ────────────────────────────
dealerships:
  enabled: true

# ── Transaction Logging ─────────────────────
transaction-logging:
  enabled: true
  keep-days: 30

# ── Tab List ─────────────────────────────────
tab-list:
  enabled: true
  update-interval-ticks: 100

# ── Taxes ────────────────────────────────────
taxes:
  enabled: false
  # Mode: NONE, INCOME_TAX, SET_TAX, PERCENTAGE_BALANCE
  mode: NONE
  # Income tax: % of income earned since last assessment
  income-tax-rate: 10
  # Set tax: fixed amount per assessment
  set-tax-amount: 100
  # Balance tax: % of total balance
  balance-tax-rate: 1
  # How often taxes are assessed in minutes (0 = disable automatic assessment)
  interval-minutes: 60
  # Grace period to pay after assessment in minutes (0 = no grace, must pay immediately)
  grace-period-minutes: 30
  # Payment method: AUTO (auto-deduct), MANUAL (player pays via /taxmanager), BANKNOTE (physical delivery)
  payment-method: AUTO
  # Where tax money goes: SERVER, SHARED_ACCOUNT
  auto-pay-to: SERVER
  # Shared account name for tax payments (used when auto-pay-to is SHARED_ACCOUNT, or for MANUAL pay-shared)
  tax-shared-account: "Taxes"
  # Player names who collect physical banknote tax payments
  banknote-delivery-targets: []
  # Show Tax Info button on eco panel when no payment is due (false = hidden)
  show-info-button: true
  # % penalty applied to unpaid taxes after grace period expires
  overdue-penalty-percent: 10

# ── Admin Settings ──────────────────────────
admin:
  # Server balance for collecting taxes/fees
  server-account: "Server"
