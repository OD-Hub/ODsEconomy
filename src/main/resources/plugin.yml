name: ODEco
version: 1.1.0
main: com.odeco.ODEco
api-version: 1.21
softdepend: [PlaceholderAPI]
website: https://opencode.ai

commands:
  eco:
    description: Open the economy panel
    usage: /eco
    aliases: [ecopanel, balance, bal]
    permission: odeco.use
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
    permission: odeco.use
  sell:
    description: Sell items in your hand
    usage: /sell
    permission: odeco.use
  worth:
    description: Check item worth
    usage: /worth [item]
    permission: odeco.use
  baltop:
    description: View balance top list
    usage: /baltop [page]
    permission: odeco.use
  bounty:
    description: Manage bounties
    usage: /bounty <set|check|list>
    permission: odeco.use
  lottery:
    description: View lottery info
    usage: /lottery
    permission: odeco.use
  dice:
    description: Roll the dice
    usage: /dice <amount>
    permission: odeco.use
  banknote:
    description: Create a banknote
    usage: /banknote <amount>
    permission: odeco.use
  auction:
    description: Open the auction house
    usage: /auction
    permission: odeco.use
  ecoadmin:
    description: Admin economy commands
    usage: /ecoadmin <give|take|set|reload>
    permission: odeco.admin
  interest:
    description: View account interest
    usage: /interest
    permission: odeco.use
  taxmanager:
    description: Manage and pay taxes
    usage: /taxmanager [pay <amount|all>|check]
    permission: odeco.taxmanager
  taxsetup:
    description: Open the tax setup wizard
    usage: /taxsetup
    permission: odeco.admin
  dealership:
    description: Open a dealership
    usage: /dealership [name]
    permission: odeco.use
  dealershipsetup:
    description: Manage dealership setup
    usage: /dealershipsetup
    permission: odeco.admin

permissions:
  odeco.use:
    description: Use basic economy commands
    default: true
  odeco.admin:
    description: Admin economy commands
    default: op
    children:
      odeco.use: true
  odeco.taxmanager:
    description: Manage tax settings and pay taxes
    default: op
    children:
      odeco.use: true
